<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement - Department</title>
    <link rel="stylesheet" href="{% static 'placement/css/bootstrap.css'%}">
    <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous"> -->
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center alert alert-info">Placement Cell student record</h2>
        <div class="d-flex justify-content-end align-items-center mb-3">
          {% if user.is_authenticated %}
            <span class="mr-3 text-muted">Signed in as <strong>{{ user.username }}</strong></span>
            <form action="{% url 'logout' %}" method="post" class="d-inline ml-2">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
            </form>
          {% endif %}
        </div>
        {% block content %} 
        {% endblock content %}
    </div>
    <script src = "https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
</body>
</html>
